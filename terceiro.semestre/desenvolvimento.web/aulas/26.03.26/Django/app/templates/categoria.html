{% extends 'template.html' %}
{% block titulo %} Django Categorias {% endblock %}

{% block conteudo %}
    <div class="page-header">
        <h1>Categorias</h1>
        <a href="{% url 'addcategoria' %}" class="btn btn-primary">+ Add Categoria</a>
    </div>

    <div class="card-list">
        {% for cat in categorias %}
        <div class="card">
            <div class="card-info">
                <span class="badge">#{{cat.id}}</span>
                <span class="card-nome">{{cat.nome}}</span>
            </div>
            <div class="card-actions">
                <a href="{% url 'editcategoria' cat.id %}" class="btn btn-edit">Editar</a>
                <a href="{% url 'delcategoria' cat.id %}" class="btn btn-danger">Excluir</a>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
