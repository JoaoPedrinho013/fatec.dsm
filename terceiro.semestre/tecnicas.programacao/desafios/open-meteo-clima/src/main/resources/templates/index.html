<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Clima</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f0f4f8;
            --surface: #ffffff;
            --border: #d6e0ea;
            --text-primary: #1e2d3d;
            --text-secondary: #6b8499;
            --accent: #4a90b8;
            --accent-hover: #357a9e;
            --input-bg: #f7fafc;
            --shadow: 0 2px 24px rgba(74, 144, 184, 0.08);
            --shadow-hover: 0 6px 32px rgba(74, 144, 184, 0.14);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(74, 144, 184, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(100, 170, 210, 0.05) 0%, transparent 50%);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            animation: fadeUp 0.6s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.8rem 2.4rem;
            box-shadow: var(--shadow);
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2.4rem;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #c8dff0 0%, #a8cde0 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.2rem;
        }

        .brand-icon svg {
            width: 26px;
            height: 26px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.7rem;
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 300;
            margin-top: 0.35rem;
            text-align: center;
            letter-spacing: 0.2px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 0.5rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.8rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            appearance: textfield;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }

        input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 144, 184, 0.1);
            background: #ffffff;
        }

        input[type="number"]::placeholder {
            color: #b0c4d4;
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.85rem;
            margin-top: 0.5rem;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }

        button[type="submit"]:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(74, 144, 184, 0.3);
            transform: translateY(-1px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .footer-note {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.75rem;
            color: #a8bfce;
            font-weight: 300;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C8.5 2 5.5 4.5 5 8C3 8.5 1.5 10.2 1.5 12.2C1.5 14.5 3.4 16.5 5.8 16.5H18C20.2 16.5 22 14.7 22 12.5C22 10.4 20.4 8.7 18.3 8.5C17.4 4.8 14.9 2 12 2Z"/>
                    </svg>
                </div>
                <h1>Consulta de Clima</h1>
                <p class="subtitle">Insira as coordenadas para obter dados meteorológicos</p>
            </div>

            <form action="/buscar" method="get">
                <div class="form-group">
                    <label for="latitude">Latitude</label>
                    <input type="number" id="latitude" name="latitude" step="any" placeholder="Ex: -23.55" required autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="longitude">Longitude</label>
                    <input type="number" id="longitude" name="longitude" step="any" placeholder="Ex: -46.63" required autocomplete="off" />
                </div>
                <button type="submit">Buscar Clima</button>
            </form>
        </div>

        <p class="footer-note">Dados fornecidos por Open-Meteo API</p>
    </div>
</body>
</html>
