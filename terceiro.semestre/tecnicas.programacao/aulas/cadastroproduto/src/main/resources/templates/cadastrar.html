<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>Cadastrar Produto</title>
</head>
<body>
<div class="container mt-5">
    <h1 class="display-3 mb-4">Cadastrar Produto</h1>

    <form th:action="@{/cadastrar}"
          th:object="${produto}" method="post">
        <div class="form-group">
            <label for="nome">Nome</label>
            <input class="form-control" type="text" th:field="*{nome}" placeholder="Ex. Notebook" required>
        </div>
        <div class="form-group">
            <label for="preco">Preço</label>
            <input class="form-control"  type="number" th:field="*{preco}" placeholder="Ex. 13.00" required step="0.01">
        </div>
        <div class="form-group">
            <label for="categoria">Categoria</label>
            <input class="form-control"  type="text" th:field="*{categoria}" placeholder="Ex. Eletrônico" required>
        </div>
        <div class="form-group">
            <label for="descricao">Descrição</label>
            <input class="form-control"  type="text" th:field="*{descricao}" placeholder="Ex. é azul" required>
        </div>
        <button class="btn btn-primary" type="submit">Cadastrar</button>
    </form>

    <a class="btn btn-secondary mt-3" href="/lista"> Ver Lista de Produtos</a>
</div>
</body>
</html>
