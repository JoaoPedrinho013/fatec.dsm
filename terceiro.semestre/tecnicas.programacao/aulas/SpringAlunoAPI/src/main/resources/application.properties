spring.application.name=cadastro-alunos

# ── PostgreSQL ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/cadastro_alunos
spring.datasource.username=postgres
spring.datasource.password=p3miiezy
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# create-drop: cria as tabelas ao iniciar e remove ao parar (bom para dev)
# update: só aplica alterações sem apagar dados (use em produção)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Servidor ─────────────────────────────────────────────────────────────────
server.port=8080
